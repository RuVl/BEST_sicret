# Локальная инфраструктура для разработки: postgres + redis с портами на host.
# Сервисы (bot/members_sync) запускаются на хосте и ходят на localhost:5432/6379.
# Полный стек в контейнерах — docker-compose.yaml. Тома общие с прод-стеком
# (best_db / best_cache), чтобы данные не расходились.

services:
  postgres:
    image: docker.io/library/postgres:17.6
    restart: unless-stopped
    env_file: postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:8.2.2
    restart: unless-stopped
    env_file: redis/.env
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data

volumes:
  postgres_volume:
    name: best_db
  redis_volume:
    name: best_cache
