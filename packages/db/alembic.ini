# Единая конфигурация миграций для всех сервисов (bot + members_sync).
# Запускать из каталога packages/db, напр.: alembic upgrade head
# URL берётся из переменных окружения POSTGRES_*/DOCKER_POSTGRES_* (см. env.py).

[alembic]
# path to migration scripts
script_location = best_db/migrations

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory. Делает пакет best_db импортируемым.
prepend_sys_path = .

version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.

;sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
