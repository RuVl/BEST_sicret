# Единый pre-commit на весь репозиторий.
#
# Установка:  pre-commit install
# Прогон:     pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

